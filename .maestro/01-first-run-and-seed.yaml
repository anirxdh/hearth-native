# E2E: first run -> demo family seeded -> digest tells the story.
# Runs on the iOS simulator via Maestro (https://maestro.mobile.dev), locally
# with scripts/e2e-local.sh or in CI via .github/workflows/e2e-ios.yml.
appId: com.anirudh.hearth
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow

# clearState wipes app data but the Keychain key can survive a reinstall;
# the P1 recovery screen offers "Start fresh" in that case. Handle both.
- runFlow:
    when:
      visible: 'Start fresh'
    commands:
      - tapOn: 'Start fresh'

# Empty state: the calm onboarding.
- assertVisible: 'Start your care circle'
- assertVisible: 'Add a person'

# Load the demo family from Settings (shared steps).
- runFlow: shared/load-demo.yaml

# The digest must lead with Robert's metformin, the circle shows all three.
- assertVisible: 'NEEDS ACTION'
- assertVisible:
    text: '.*Metformin.*'
- assertVisible: 'Request refill'
- assertVisible:
    text: '.*Robert.*'
- assertVisible:
    text: '.*Ellie.*'
- assertVisible:
    text: '.*Rosa.*'
- assertVisible: 'Act now'
