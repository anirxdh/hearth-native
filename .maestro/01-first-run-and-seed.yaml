# E2E: first run -> through the threshold -> demo family seeded -> digest
# tells the story. Runs on the iOS simulator via Maestro, locally with
# scripts/e2e-local.sh (the 3s orb hold itself is covered by Playwright;
# dev builds accept the automation hook).
appId: com.anirudh.rua
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow

# clearState wipes app data but the Keychain key can survive a reinstall;
# the P1 recovery screen offers "Start fresh" in that case. Handle both.
- runFlow:
    when:
      visible: 'Start fresh'
    commands:
      - tapOn: 'Start fresh'

# Fresh state lands on the threshold: the orb is the only door. A cold
# dev-client boot re-fetches the JS bundle from Metro and can hold the
# splash well past the default lookup window on a loaded host.
- extendedWaitUntil:
    visible: 'Press and hold to begin'
    timeout: 30000
- openLink: 'rua:///welcome?enter=1'

# The landing: carousel + account card + the just-looking path.
- assertVisible: 'Welcome to RUA'
- takeScreenshot: /private/tmp/claude-501/-Users-anirudh-Desktop-ACL-challenge/fb05be2e-6ab1-44de-bcde-2f6aff46958b/scratchpad/ios-01-landing
# Let the entrance choreography finish before touching the link (a tap on a
# still-translating element can land off-target); retry once if the confirm
# dialog did not open, and clear a stray second dialog if both taps landed.
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: 'ob-demo'
- runFlow:
    when:
      notVisible: 'Load demo'
    commands:
      - tapOn:
          id: 'ob-demo'
- tapOn: 'Load demo'
- runFlow:
    when:
      visible: 'Cancel'
    commands:
      - tapOn: 'Cancel'

# The digest must lead with Robert's metformin, the circle shows all three.
# (Entrances settle first; the perpetual pulse loops are tiny and survive
# the accessibility snapshot, but mid-entrance layouts can truncate it.)
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: 'NEEDS ACTION'
- assertVisible:
    text: '.*Metformin.*'
- assertVisible: 'Request refill'
- assertVisible:
    text: '.*Robert.*'
- assertVisible:
    text: '.*Ellie.*'
- assertVisible:
    text: '.*Rosa.*'
# The circle card reads as one VoiceOver sentence; match inside it.
- assertVisible:
    text: '.*Act now.*'
- takeScreenshot: /private/tmp/claude-501/-Users-anirudh-Desktop-ACL-challenge/fb05be2e-6ab1-44de-bcde-2f6aff46958b/scratchpad/ios-01-digest
