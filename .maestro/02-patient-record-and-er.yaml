# E2E: the record is complete and the emergency paper is two taps away.
# Self-sufficient: seeds the demo family first if the circle is empty.
appId: com.anirudh.hearth
---
- launchApp:
    permissions:
      notifications: allow
- runFlow:
    when:
      visible: 'Start fresh'
    commands:
      - tapOn: 'Start fresh'
- runFlow:
    when:
      visible: 'Start your care circle'
    commands:
      - runFlow: shared/load-demo.yaml

# Into Robert's record: the allergy banner must be there, on every tab.
- tapOn: 'Robert'
- assertVisible:
    text: 'ALLERGY: Penicillin.*'
- assertVisible: 'Robert Alvarez'

# Tabs: Activity has the chart controls, History has the timeline.
- tapOn: 'Activity'
- assertVisible:
    text: 'ALLERGY: Penicillin.*'
- assertVisible: '30d'
- assertVisible: 'OBSERVATIONS'
- tapOn: 'History'
- assertVisible:
    text: '.*Atrial fibrillation.*'

# The ER sheet: critical facts above the fold, reachable in two taps.
- tapOn: 'Overview'
- tapOn: 'ER sheet'
- assertVisible:
    text: 'ALLERGY: Penicillin.*'
- assertVisible: 'Current medications'
- assertVisible:
    text: '.*Apixaban.*'

# The guides: offline book, 911-first banner (deep link; confirm if asked).
- openLink: hearth:///guides
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- assertVisible: 'Open this when something happens'
- assertVisible: 'After a fall'
- tapOn: 'After a fall'
- assertVisible: 'Keep them still at first'
- assertVisible:
    text: '.*blood thinner.*'
