# E2E: the record is complete and the emergency paper is two taps away.
# Owns its state: flows run in RANDOM order, and this one needs the demo
# family's Robert (penicillin allergy), not whichever Robert a previous
# flow left behind - so it always starts clean and seeds the demo.
appId: com.anirudh.hearth
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- runFlow:
    when:
      visible: 'Start fresh'
    commands:
      - tapOn: 'Start fresh'
# Self-sufficiency covers both empty states: the fresh-install threshold
# (orb -> onboarding -> demo link) and the account-no-patients empty home.
- runFlow:
    when:
      visible: 'Press and hold to begin'
    commands:
      - openLink: 'hearth:///welcome?enter=1'
      - waitForAnimationToEnd:
          timeout: 2500
      - tapOn:
          id: 'ob-demo'
      - runFlow:
          when:
            notVisible: 'Load demo'
          commands:
            - tapOn:
                id: 'ob-demo'
      - tapOn: 'Load demo'
      - runFlow:
          when:
            visible: 'Cancel'
          commands:
            - tapOn: 'Cancel'
- runFlow:
    when:
      visible: 'Start your care circle'
    commands:
      - runFlow: shared/load-demo.yaml

# Into Robert's record: the allergy banner must be there, on every tab.
# (The circle card reads as one VoiceOver sentence, "RA, Robert, Dad ...";
# match it whole so the tap cannot land on the digest headline instead.)
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: 'RA, Robert.*'
# A tap right after a warm relaunch can land before the page is
# interactive; if the record did not open, tap once more.
- runFlow:
    when:
      notVisible: 'Robert Alvarez'
    commands:
      - tapOn:
          text: 'RA, Robert.*'
# The record is a large, living hierarchy; the first accessibility
# snapshot after arrival is sometimes incomplete. Settle, then wait long.
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      text: 'Allergies: Penicillin.*'
    timeout: 15000
- assertVisible: 'Robert Alvarez'

# Tabs: Activity has the chart controls, History has the timeline.
- tapOn: 'Activity'
- assertVisible:
    text: 'Allergies: Penicillin.*'
- assertVisible: '30d'
- assertVisible: 'OBSERVATIONS'
- tapOn: 'History'
- assertVisible:
    text: '.*Atrial fibrillation.*'

# The ER sheet: critical facts above the fold, reachable in two taps.
- tapOn: 'Overview'
- tapOn: 'ER sheet'
- assertVisible:
    text: '.*ALLERGY: Penicillin.*'
- assertVisible: 'Current medications'
- assertVisible:
    text: '.*Apixaban.*'

# The guides: offline book, 911-first banner (deep link; confirm if asked).
- openLink: hearth:///guides
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- assertVisible: 'Open this when something happens'
- assertVisible: 'Open guide: After a fall'
- tapOn: 'Open guide: After a fall'
- assertVisible:
    text: 'Step 1: Keep them still at first.*'
- assertVisible:
    text: '.*blood thinner.*'
